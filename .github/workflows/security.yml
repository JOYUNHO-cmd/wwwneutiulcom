name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    name: Dependency audit and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: node scripts/generate-portfolio-highlights.mjs
      - run: node scripts/generate-region-case-index.mjs
      - run: npm run lint
      - run: npm test
