name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    name: Dependency audit and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: node scripts/generate-portfolio-highlights.mjs
      - run: node scripts/generate-region-case-index.mjs
      - run: npm run lint
      - run: npm test
